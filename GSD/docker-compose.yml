version: '3.8'

services:
  # PostgreSQL with PostGIS and pgvector
  postgres:
    image: postgis/postgis:16-3.4
    container_name: gsd-postgres
    environment:
      POSTGRES_DB: gsd
      POSTGRES_USER: gsd_user
      POSTGRES_PASSWORD: gsd_password
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
    networks:
      - gsd-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gsd_user -d gsd"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MinIO Object Storage
  minio:
    image: minio/minio:latest
    container_name: gsd-minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    networks:
      - gsd-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # MinIO Client for bucket creation
  minio-client:
    image: minio/mc:latest
    container_name: gsd-minio-client
    depends_on:
      minio:
        condition: service_healthy
    volumes:
      - ./scripts:/scripts
    networks:
      - gsd-network
    entrypoint: >
      /bin/sh -c "
      mc alias set minio http://minio:9000 minioadmin minioadmin123;
      mc mb minio/gsd-originals --ignore-existing;
      mc mb minio/gsd-proxies --ignore-existing;
      mc mb minio/gsd-analysis --ignore-existing;
      mc policy set public minio/gsd-originals;
      mc policy set public minio/gsd-proxies;
      mc policy set public minio/gsd-analysis;
      echo 'MinIO buckets created successfully';
      exit 0;
      "

  # OpenSearch
  opensearch:
    image: opensearchproject/opensearch:2.11.1
    container_name: gsd-opensearch
    environment:
      - cluster.name=gsd-cluster
      - node.name=gsd-node
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
      - "DISABLE_INSTALL_DEMO_CONFIG=true"
      - "DISABLE_SECURITY_PLUGIN=true"
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - "9200:9200"
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    networks:
      - gsd-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  # OpenSearch Dashboards
  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:2.11.1
    container_name: gsd-opensearch-dashboards
    environment:
      - 'OPENSEARCH_HOSTS=["http://opensearch:9200"]'
      - "DISABLE_SECURITY_DASHBOARDS_PLUGIN=true"
    ports:
      - "5601:5601"
    depends_on:
      opensearch:
        condition: service_healthy
    networks:
      - gsd-network

  # Redis
  redis:
    image: redis:7-alpine
    container_name: gsd-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - gsd-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Metabase
  metabase:
    image: metabase/metabase:latest
    container_name: gsd-metabase
    environment:
      MB_DB_TYPE: postgres
      MB_DB_DBNAME: gsd
      MB_DB_PORT: 5432
      MB_DB_USER: gsd_user
      MB_DB_PASS: gsd_password
      MB_DB_HOST: postgres
    ports:
      - "3001:3000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - metabase_data:/metabase-data
    networks:
      - gsd-network

  # pgAdmin (optional)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: gsd-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@gsd.local
      PGADMIN_DEFAULT_PASSWORD: admin123
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - gsd-network

volumes:
  postgres_data:
  minio_data:
  opensearch_data:
  redis_data:
  metabase_data:
  pgadmin_data:

networks:
  gsd-network:
    driver: bridge